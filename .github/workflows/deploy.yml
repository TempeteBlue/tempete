name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Permet de déclencher manuellement
  workflow_dispatch:

# Permissions nécessaires pour GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Concurrence pour éviter les déploiements simultanés
concurrency:
  group: "pages"
  cancel-in-progress: false

# Variables d'environnement
defaults:
  run:
    shell: bash

jobs:
  # Job de build
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Clean previous build
        run: |
          echo "🧹 Nettoyage du build précédent..."
          # Delete public directory
          rm -rf public 2>/dev/null || true
          # Delete resources directory
          rm -rf resources 2>/dev/null || true
          # Delete .hugo_build.lock
          rm -f .hugo_build.lock 2>/dev/null || true

      - name: Copy PDFs to static folder
        run: |
          echo "📄 Syncing PDFs from content/manuels to static/pdf/manuels..."
          # Create static/pdf/manuels directory
          mkdir -p static/pdf/manuels
          
          # Clean up orphaned PDFs in static (remove PDFs no longer in content)
          echo "🧹 Cleaning up orphaned PDFs..."
          find static/pdf/manuels -name "*.pdf" -type f | while read static_pdf; do
            content_pdf="content${static_pdf#static/pdf}"
            if [ ! -f "$content_pdf" ]; then
              echo "Removing orphaned PDF: $static_pdf (no longer in content)"
              rm -f "$static_pdf"
            fi
          done
          
          # Copy all PDFs from content/manuels to static/pdf/manuels
          find content/manuels -name "*.pdf" -type f | while read pdf_file; do
            static_path="static/pdf/${pdf_file#content/}"
            mkdir -p "$(dirname "$static_path")"
            cp "$pdf_file" "$static_path"
            echo "Copied PDF: $pdf_file -> $static_path"
          done
          echo "✅ PDFs synced successfully"

      - name: Convert PDFs to PNG
        run: |
          # Create static/images/manuels directory
          mkdir -p static/images/manuels
          
          # Clean up orphaned PNGs (remove PNGs without corresponding PDFs)
          echo "🧹 Cleaning up orphaned PNGs..."
          find static/images/manuels -name "*.png" -type f | while read png_file; do
            # Get the corresponding PDF path
            pdf_path="content${png_file#static/images}"
            pdf_path="${png_file%.png}.pdf"
            
            # Check if PDF exists in content
            if [ ! -f "$pdf_path" ]; then
              echo "Removing orphaned PNG: $png_file (no corresponding PDF)"
              rm -f "$png_file"
            fi
          done
          
          # Process PDFs in content/manuels and convert only if PNG doesn't exist
          echo "📄 Converting PDFs to PNGs (skip if already exists)..."
          find content/manuels -name "*.pdf" -type f | while read pdf_file; do
            pdf_dir=$(dirname "$pdf_file")
            pdf_name=$(basename "$pdf_file" .pdf)
            static_dir="static/images/${pdf_dir#content/}"
            png_file="$static_dir/$pdf_name.png"
            
            # Create directory
            mkdir -p "$static_dir"
            
            # Skip if PNG already exists
            if [ -f "$png_file" ]; then
              echo "Skipping: $pdf_file (PNG already exists: $png_file)"
              continue
            fi
            
            # Convert PDF to PNG
            if pdftoppm -png -f 1 -l 1 -singlefile -r 150 "$pdf_file" "$static_dir/$pdf_name" 2>/dev/null; then
              echo "Converted: $pdf_file -> $png_file"
            else
              echo "Error converting: $pdf_file"
            fi
          done
          
          # Copy any existing PNGs from content/manuels to static/images/manuels
          echo "📋 Copying existing PNGs from content to static..."
          find content/manuels -name "*.png" -type f | while read png_file; do
            static_path="static/images/${png_file#content/}"
            mkdir -p "$(dirname "$static_path")"
            cp "$png_file" "$static_path"
            echo "Copied: $png_file -> $static_path"
          done

      - name: Commit PNG files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: Add manuel page pictures from PDF first pages"
          file_pattern: "static/images/manuels/**/*.png"
          push_options: '--force-with-lease'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.124.1'
          extended: true  # Nécessaire pour SCSS/Sass

      - name: Setup Node.js (pour les assets)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node dependencies (si package.json existe)
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
          fi

      - name: Clean generated content
        run: |
          echo "🧹 Nettoyage du contenu généré..."
          # Delete ALL generated markdown files in content/ (except _index.md and keep PNGs)
          find content/ -name "*.md" -type f ! -name "_index.md" -delete 2>/dev/null || true
          echo "✅ Nettoyage des fichiers markdown terminé"

      - name: Clean static folders
        run: |
          echo "🧹 Nettoyage des dossiers statiques obsolètes..."
          # Sync static/images/produits with content/produits
          if [ -d "content/produits" ] && [ -d "static/images/produits" ]; then
            for category_dir in static/images/produits/*/; do
              category=$(basename "$category_dir")
              if [ ! -d "content/produits/$category" ]; then
                echo "  🗑️ Suppression: static/images/produits/$category"
                rm -rf "$category_dir"
              fi
            done
          fi
          # Sync static/pdf/produits with content/produits
          if [ -d "content/produits" ] && [ -d "static/pdf/produits" ]; then
            for category_dir in static/pdf/produits/*/; do
              category=$(basename "$category_dir")
              if [ ! -d "content/produits/$category" ]; then
                echo "  🗑️ Suppression: static/pdf/produits/$category"
                rm -rf "$category_dir"
              fi
            done
          fi
          # Sync static/images/usages with content/usages
          if [ -d "content/usages" ] && [ -d "static/images/usages" ]; then
            for category_dir in static/images/usages/*/; do
              category=$(basename "$category_dir")
              if [ ! -d "content/usages/$category" ]; then
                echo "  🗑️ Suppression: static/images/usages/$category"
                rm -rf "$category_dir"
              fi
            done
          fi
          # Sync static/pdf/usages with content/usages
          if [ -d "content/usages" ] && [ -d "static/pdf/usages" ]; then
            for category_dir in static/pdf/usages/*/; do
              category=$(basename "$category_dir")
              if [ ! -d "content/usages/$category" ]; then
                echo "  🗑️ Suppression: static/pdf/usages/$category"
                rm -rf "$category_dir"
              fi
            done
          fi
          echo "✅ Nettoyage des dossiers statiques terminé"

      - name: Generate product pages from data
        run: |
          echo "🔄 Génération automatique des pages produits..."
          # Script pour générer les pages Markdown des produits depuis CSV/YAML
          python3 scripts/generate-products.py || echo "Pas de script de génération"

      - name: Process simple manual folders
        run: |
          echo "📁 Traitement des dossiers de manuels simples..."
          python3 scripts/process-simple-manuals.py || echo "Pas de dossiers simples à traiter"

      - name: Process simple product folders
        run: |
          echo "📦 Traitement des dossiers de produits simples..."
          python3 scripts/process-simple-products.py || echo "Pas de dossiers simples à traiter"

      - name: Process simple usage folders
        run: |
          echo "🔧 Traitement des dossiers d'équipements usagés simples..."
          python3 scripts/process-simple-usages.py || echo "Pas de dossiers simples à traiter"

      - name: Generate manual indexes from PDF folders
        run: |
          echo "📄 Génération des index pour les dossiers de manuels..."
          python3 scripts/generate-manual-indexes.py || echo "Pas de dossiers à indexer"

      - name: Generate product indexes from folders
        run: |
          echo "📦 Génération des index pour les dossiers de produits..."
          python3 scripts/generate-product-indexes.py || echo "Pas de dossiers à indexer"

      - name: Generate usage indexes from folders
        run: |
          echo "🔧 Génération des index pour les dossiers d'équipements usagés..."
          python3 scripts/generate-usage-indexes.py || echo "Pas de dossiers à indexer"

      - name: Build Hugo site
        run: hugo --gc --minify --baseURL "https://www.souffleur.ca/"
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production

      - name: Generate search index
        run: |
          echo "🔍 Génération de l'index de recherche..."
          # Créer un index JSON pour la recherche
          python3 scripts/generate-search-index.py || echo "Pas de script de recherche"

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Job de déploiement
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
