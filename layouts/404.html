<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page non trouvée | {{ .Site.Title }}</title>
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <link rel="icon" type="image/x-icon" href="{{ "favicon.ico" | relURL }}?v=2">
</head>
<body>
  {{ partial "header.html" . }}
  <main id="main-content">
    <div class="container page-container" style="text-align:center;padding:4rem 1rem">
      <h1 style="font-size:4rem;margin-bottom:0">404</h1>
      <h2 style="margin-top:0">Page non trouvée</h2>
      <p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
      <p>Utilisez la recherche ci-dessus ou <a href="{{ "/" | relURL }}">retournez à l'accueil</a>.</p>
    </div>
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
